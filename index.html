<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Puppet Interactive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
            background: #e8dcc8;
            position: relative;
        }

        #container {
            width: 100%;
            height: 100%;
            position: relative;
            /* Enhanced rice paper texture */
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 119, 101, 0.03) 2px, rgba(139, 119, 101, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(139, 119, 101, 0.03) 2px, rgba(139, 119, 101, 0.03) 4px),
                repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(200, 180, 150, 0.015) 8px, rgba(200, 180, 150, 0.015) 10px),
                radial-gradient(circle at 20% 30%, rgba(210, 190, 160, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(210, 190, 160, 0.1) 0%, transparent 50%);
            background-color: #f5ebe0;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .tool {
            cursor: pointer;
            transition: filter 0.2s;
        }

        .tool:hover {
            filter: drop-shadow(0 0 8px rgba(255, 165, 0, 0.8));
        }

        #message-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(245, 235, 224, 0.95);
            z-index: 1000;
        }

        #message-text {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #2d1810;
            text-align: center;
            padding: 2rem;
            max-width: 80%;
            line-height: 1.6;
            font-weight: normal;
            letter-spacing: 0.05em;
        }

        #restart-button {
            margin-top: 2rem;
            padding: 1rem 3rem;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            background: transparent;
            border: 2px solid #2d1810;
            color: #2d1810;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.1em;
        }

        #restart-button:hover {
            background: #2d1810;
            color: #f5ebe0;
        }

        .fade-out {
            animation: fadeOut 2s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0.15;
            }
        }

        .scene-element {
            transition: opacity 2s;
        }

        .disabled {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" id="main-svg">
            <defs>
                <!-- Amber glow filter (shadow puppet edge) -->
                <filter id="amber-glow">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                    <feColorMatrix in="coloredBlur" type="matrix"
                        values="1 0 0 0 0.8
                                0 0.6 0 0 0.3
                                0 0 0.4 0 0
                                0 0 0 1 0"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Leather/cowhide texture pattern -->
                <pattern id="leather-texture" width="25" height="25" patternUnits="userSpaceOnUse">
                    <rect width="25" height="25" fill="rgba(0,0,0,0.01)"/>
                    <circle cx="3" cy="3" r="0.6" fill="rgba(0,0,0,0.06)"/>
                    <circle cx="15" cy="15" r="0.6" fill="rgba(0,0,0,0.06)"/>
                    <circle cx="9" cy="20" r="0.5" fill="rgba(0,0,0,0.05)"/>
                    <circle cx="20" cy="8" r="0.5" fill="rgba(0,0,0,0.05)"/>
                    <path d="M 2 10 Q 5 12 8 10" stroke="rgba(0,0,0,0.03)" stroke-width="0.5" fill="none"/>
                </pattern>

                <!-- Matrix perforation pattern (shadow puppet openwork) -->
                <pattern id="perforation" width="12" height="12" patternUnits="userSpaceOnUse">
                    <circle cx="6" cy="6" r="1.2" fill="rgba(255,255,255,0.25)"/>
                    <circle cx="6" cy="6" r="0.8" fill="rgba(0,0,0,0.1)"/>
                </pattern>

                <!-- Sky ink wash gradient (lapis lazuli blue) -->
                <linearGradient id="ink-wash-sky" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#c8dbe8;stop-opacity:0.4" />
                    <stop offset="50%" style="stop-color:#6a8eb5;stop-opacity:0.5" />
                    <stop offset="100%" style="stop-color:#4a6fa5;stop-opacity:0.7" />
                </linearGradient>

                <!-- Earth gradient (ochre yellow) -->
                <linearGradient id="earth-wash" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#d4c5a9;stop-opacity:0.8" />
                    <stop offset="100%" style="stop-color:#b8a88a;stop-opacity:0.9" />
                </linearGradient>

                <!-- Mountain ink wash (malachite green with indigo) -->
                <linearGradient id="mountain-ink" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#7a9f8e;stop-opacity:0.5" />
                    <stop offset="100%" style="stop-color:#4a6f5a;stop-opacity:0.7" />
                </linearGradient>

                <!-- Distant mountain mist -->
                <linearGradient id="mountain-mist" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#a8c5b5;stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#5a7a6a;stop-opacity:0.4" />
                </linearGradient>

                <!-- Gold thread outline -->
                <linearGradient id="gold-thread" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#daa520;stop-opacity:0.9" />
                    <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#b8860b;stop-opacity:0.9" />
                </linearGradient>
            </defs>

            <!-- Sky (lapis lazuli blue ink wash) -->
            <rect x="0" y="0" width="1200" height="350" fill="url(#ink-wash-sky)"/>

            <!-- Atmospheric mist layer -->
            <ellipse cx="600" cy="320" rx="500" ry="60" fill="#e8f0f5" opacity="0.2"/>

            <!-- Earth/Ground (ochre yellow with texture) -->
            <path d="M 0 350 Q 300 340 600 350 Q 900 360 1200 350 L 1200 800 L 0 800 Z"
                  fill="url(#earth-wash)"/>

            <!-- Ground texture strokes -->
            <g opacity="0.15">
                <path d="M 100 400 Q 200 398 300 400" stroke="#8b7355" stroke-width="1" fill="none"/>
                <path d="M 150 450 Q 250 448 350 450" stroke="#8b7355" stroke-width="0.8" fill="none"/>
                <path d="M 200 500 Q 350 498 500 500" stroke="#8b7355" stroke-width="0.8" fill="none"/>
            </g>

            <!-- Mountains (Right Side) - Two visible peaks with traditional landscape technique -->
            <g id="mountains" class="scene-element">
                <!-- Distant back mountain (atmospheric perspective, light ink wash) -->
                <path id="back-mountain" d="M 650 350 Q 750 200 850 250 Q 950 300 1050 320 Q 1100 330 1150 340 L 1150 500 L 650 500 Z"
                      fill="url(#mountain-mist)" stroke="#6a8a7a" stroke-width="1.2" opacity="0.6"/>

                <!-- Wet ink wash on distant mountain -->
                <ellipse cx="850" cy="280" rx="80" ry="40" fill="#7a9f8e" opacity="0.15"/>

                <!-- Front mountain (main, with hemp-fiber and axe-cut strokes) -->
                <path id="front-mountain" d="M 600 380 Q 650 250 720 280 Q 780 160 860 220 Q 920 180 1000 280 Q 1080 340 1150 360 L 1150 500 L 600 500 Z"
                      fill="url(#mountain-ink)" stroke="#2d3d35" stroke-width="2.5" filter="url(#amber-glow)"/>

                <!-- Blue-green coloring accents (Prussian blue, malachite green) -->
                <g opacity="0.25">
                    <ellipse cx="720" cy="310" rx="50" ry="35" fill="#4a6fa5"/>
                    <ellipse cx="860" cy="260" rx="60" ry="40" fill="#5a8270"/>
                    <ellipse cx="1000" cy="320" rx="55" ry="38" fill="#6a9f80"/>
                </g>

                <!-- Hemp-fiber texture strokes (cun fa 皴法) -->
                <g opacity="0.6" stroke="#1a2a23" fill="none">
                    <!-- Left peak strokes -->
                    <path d="M 715 295 Q 718 310 720 325 Q 722 340 725 355" stroke-width="1.2"/>
                    <path d="M 725 300 Q 728 318 730 335 Q 732 348 735 360" stroke-width="1"/>
                    <path d="M 735 305 Q 738 322 740 340 Q 742 353 745 365" stroke-width="0.8"/>

                    <!-- Center peak strokes (denser, axe-cut style) -->
                    <path d="M 855 235 L 858 250 M 862 252 L 865 268" stroke-width="1.5"/>
                    <path d="M 860 238 L 862 255 M 867 257 L 870 275" stroke-width="1.3"/>
                    <path d="M 868 245 L 870 262 M 875 264 L 878 282" stroke-width="1.2"/>
                    <path d="M 875 252 L 878 270 M 882 272 L 885 290" stroke-width="1"/>

                    <!-- Right peak strokes -->
                    <path d="M 995 295 Q 998 315 1000 335 Q 1002 350 1005 365" stroke-width="1.2"/>
                    <path d="M 1005 300 Q 1008 320 1010 340 Q 1012 355 1015 370" stroke-width="1"/>
                    <path d="M 1015 310 Q 1018 328 1020 345 Q 1022 358 1025 370" stroke-width="0.9"/>
                </g>

                <!-- Rhythmic moss dots (dian tai 點苔) -->
                <g opacity="0.55">
                    <!-- Left peak moss -->
                    <circle cx="738" cy="318" r="2.2" fill="#2d3d35"/>
                    <circle cx="742" cy="328" r="1.8" fill="#2d3d35"/>
                    <circle cx="748" cy="338" r="2" fill="#2d3d35"/>
                    <circle cx="745" cy="348" r="1.6" fill="#2d3d35"/>

                    <!-- Center peak moss (denser) -->
                    <circle cx="878" cy="275" r="2.5" fill="#1a2a23"/>
                    <circle cx="885" cy="285" r="2" fill="#1a2a23"/>
                    <circle cx="892" cy="295" r="2.2" fill="#1a2a23"/>
                    <circle cx="888" cy="305" r="1.8" fill="#1a2a23"/>
                    <circle cx="895" cy="315" r="2" fill="#1a2a23"/>

                    <!-- Right peak moss -->
                    <circle cx="1018" cy="328" r="2.2" fill="#2d3d35"/>
                    <circle cx="1025" cy="338" r="1.9" fill="#2d3d35"/>
                    <circle cx="1020" cy="348" r="1.7" fill="#2d3d35"/>
                </g>

                <!-- Sparse ancient pine tree -->
                <g opacity="0.75">
                    <line x1="922" y1="350" x2="922" y2="275" stroke="#3d2d25" stroke-width="2.5"/>
                    <!-- Pine crown (simplified traditional style) -->
                    <path d="M 922 285 L 908 298 L 936 298 Z" fill="#3d5a4f" opacity="0.7"/>
                    <path d="M 922 300 L 905 316 L 939 316 Z" fill="#4a6f5a" opacity="0.7"/>
                    <path d="M 922 318 L 902 336 L 942 336 Z" fill="#5a8270" opacity="0.7"/>
                    <!-- Pine needles detail -->
                    <path d="M 910 295 L 906 292 M 914 295 L 912 290" stroke="#2d3d35" stroke-width="0.8" fill="none"/>
                </g>

                <!-- Bamboo grove (minimal lines) -->
                <g opacity="0.6" stroke="#4a6f5a" fill="none">
                    <line x1="1050" y1="380" x2="1050" y2="340" stroke-width="1.5"/>
                    <line x1="1060" y1="385" x2="1060" y2="348" stroke-width="1.3"/>
                    <line x1="1055" y1="382" x2="1055" y2="345" stroke-width="1.2"/>
                </g>

                <!-- Terraced field indication (minimal plane) -->
                <path d="M 750 420 L 820 418 L 818 425 L 748 427 Z" fill="#b8a88a" opacity="0.3" stroke="#8b7355" stroke-width="0.5"/>
            </g>

            <!-- Farmer (Left Side) - Shadow puppet and traditional painting style -->
            <g id="farmer" class="scene-element">
                <!-- Body segments with brass rivet joints and leather texture -->

                <!-- Legs (dark skin with sun-kissed texture) -->
                <g id="farmer-legs">
                    <!-- Left leg with leather texture -->
                    <ellipse cx="180" cy="520" rx="8" ry="30" fill="#8b6f47" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.2" filter="url(#amber-glow)"/>
                    <rect x="176" y="505" width="8" height="30" fill="url(#leather-texture)" opacity="0.6"/>
                    <ellipse cx="180" cy="560" rx="7" ry="25" fill="#6a5638" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.2"/>
                    <rect x="176" y="545" width="8" height="30" fill="url(#leather-texture)" opacity="0.6"/>

                    <!-- Right leg with leather texture -->
                    <ellipse cx="200" cy="525" rx="8" ry="28" fill="#8b6f47" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.2" filter="url(#amber-glow)"/>
                    <rect x="196" y="510" width="8" height="30" fill="url(#leather-texture)" opacity="0.6"/>
                    <ellipse cx="200" cy="565" rx="7" ry="25" fill="#6a5638" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.2"/>
                    <rect x="196" y="550" width="8" height="30" fill="url(#leather-texture)" opacity="0.6"/>

                    <!-- Brass rivet joints (clearly segmented) -->
                    <circle cx="180" cy="545" r="3.5" fill="#b8860b" stroke="#8b6914" stroke-width="1.2"/>
                    <circle cx="180" cy="545" r="2" fill="#daa520"/>
                    <circle cx="200" cy="548" r="3.5" fill="#b8860b" stroke="#8b6914" stroke-width="1.2"/>
                    <circle cx="200" cy="548" r="2" fill="#daa520"/>

                    <!-- Straw sandals (simple weave) -->
                    <ellipse cx="180" cy="585" rx="11" ry="4.5" fill="#d4c5a9" stroke="#2d1810" stroke-width="1.8"/>
                    <path d="M 172 585 L 188 585" stroke="#8b7355" stroke-width="0.6"/>
                    <ellipse cx="200" cy="590" rx="11" ry="4.5" fill="#d4c5a9" stroke="#2d1810" stroke-width="1.8"/>
                    <path d="M 192 590 L 208 590" stroke="#8b7355" stroke-width="0.6"/>
                </g>

                <!-- Torso (coarse cloth short tunic with indigo) -->
                <g id="farmer-torso">
                    <ellipse cx="190" cy="450" rx="35" ry="60" fill="#4a6fa5" fill-opacity="0.65" stroke="#2d1810" stroke-width="2.8" filter="url(#amber-glow)"/>
                    <!-- Leather and perforation overlay -->
                    <rect x="160" y="400" width="60" height="100" fill="url(#leather-texture)" opacity="0.4"/>
                    <rect x="175" y="440" width="30" height="20" fill="url(#perforation)" opacity="0.5"/>

                    <!-- Visible linen/cotton weave texture (simple folds) -->
                    <path d="M 163 425 Q 190 427 217 425" stroke="#2d3d35" stroke-width="0.8" fill="none" opacity="0.5"/>
                    <path d="M 165 445 Q 190 447 215 445" stroke="#2d3d35" stroke-width="0.8" fill="none" opacity="0.5"/>
                    <path d="M 165 465 Q 190 467 215 465" stroke="#2d3d35" stroke-width="0.8" fill="none" opacity="0.5"/>
                    <path d="M 166 485 Q 190 487 214 485" stroke="#2d3d35" stroke-width="0.8" fill="none" opacity="0.5"/>

                    <!-- Ink line redrawing accent -->
                    <path d="M 160 445 Q 190 442 220 445" stroke="#1a1a1a" stroke-width="1.2" fill="none" opacity="0.6"/>

                    <!-- Gold thread outlining -->
                    <path d="M 158 420 L 158 500" stroke="url(#gold-thread)" stroke-width="0.8" opacity="0.7"/>
                    <path d="M 222 420 L 222 500" stroke="url(#gold-thread)" stroke-width="0.8" opacity="0.7"/>
                </g>

                <!-- Arms (layered panels with sun-kissed dark skin) -->
                <g id="farmer-arms">
                    <!-- Left arm (upper) -->
                    <ellipse cx="165" cy="445" rx="8" ry="28" fill="#8b6f47" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.2" transform="rotate(-20 165 445)" filter="url(#amber-glow)"/>
                    <rect x="161" y="425" width="8" height="40" fill="url(#leather-texture)" opacity="0.5" transform="rotate(-20 165 445)"/>

                    <!-- Left arm (lower) -->
                    <ellipse cx="155" cy="470" rx="7" ry="25" fill="#6a5638" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.2" transform="rotate(-25 155 470)"/>
                    <rect x="151" y="453" width="8" height="34" fill="url(#leather-texture)" opacity="0.5" transform="rotate(-25 155 470)"/>

                    <!-- Right arm (upper, will hold tool) -->
                    <ellipse cx="215" cy="450" rx="8" ry="28" fill="#8b6f47" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.2" transform="rotate(15 215 450)" filter="url(#amber-glow)"/>
                    <rect x="211" y="430" width="8" height="40" fill="url(#leather-texture)" opacity="0.5" transform="rotate(15 215 450)"/>

                    <!-- Right arm (lower) -->
                    <ellipse cx="225" cy="478" rx="7" ry="25" fill="#6a5638" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.2" transform="rotate(20 225 478)"/>
                    <rect x="221" y="461" width="8" height="34" fill="url(#leather-texture)" opacity="0.5" transform="rotate(20 225 478)"/>

                    <!-- Brass rivet joints -->
                    <circle cx="165" cy="460" r="3.5" fill="#b8860b" stroke="#8b6914" stroke-width="1.2"/>
                    <circle cx="165" cy="460" r="2" fill="#daa520"/>
                    <circle cx="215" cy="465" r="3.5" fill="#b8860b" stroke="#8b6914" stroke-width="1.2"/>
                    <circle cx="215" cy="465" r="2" fill="#daa520"/>
                </g>

                <!-- Head (simple face, dark skin, reserved eyes) -->
                <g id="farmer-head">
                    <!-- Face (elongated profile silhouette, ochre skin tone) -->
                    <ellipse cx="190" cy="400" rx="26" ry="32" fill="#a67c52" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.8" filter="url(#amber-glow)"/>
                    <rect x="168" y="380" width="44" height="40" fill="url(#leather-texture)" opacity="0.4"/>

                    <!-- Hand-painted ink wash on face -->
                    <ellipse cx="192" cy="405" rx="8" ry="10" fill="#8b6f47" opacity="0.3"/>

                    <!-- Simple face features (profile, reserved eyes) -->
                    <ellipse cx="197" cy="395" rx="3.5" ry="2.5" fill="#2d1810" opacity="0.8"/><!-- eye -->
                    <circle cx="197" cy="395" r="1" fill="#1a1a1a"/><!-- pupil -->
                    <path d="M 200 405 Q 203 407 201 410" stroke="#2d1810" stroke-width="1.8" fill="none"/><!-- nose -->
                    <path d="M 200 415 Q 202 416 200 417" stroke="#2d1810" stroke-width="1.2" fill="none" opacity="0.6"/><!-- mouth -->

                    <!-- Bamboo hat (woven texture) -->
                    <ellipse cx="190" cy="380" rx="42" ry="13" fill="#d2b48c" fill-opacity="0.7" stroke="#2d1810" stroke-width="2.2"/>
                    <ellipse cx="190" cy="375" rx="22" ry="9" fill="#c19a6b" fill-opacity="0.7" stroke="#2d1810" stroke-width="1.8"/>
                    <!-- Weave pattern on hat -->
                    <path d="M 155 385 Q 190 378 225 385" stroke="#8b7355" stroke-width="0.8" fill="none"/>
                    <path d="M 160 383 L 220 383" stroke="#8b7355" stroke-width="0.5" fill="none" opacity="0.5"/>
                    <circle cx="190" cy="375" r="1.5" fill="#b8860b"/><!-- rivet on hat -->
                </g>

                <!-- Brass rivet joints at neck and waist -->
                <circle cx="190" cy="420" r="3.5" fill="#b8860b" stroke="#8b6914" stroke-width="1.2"/>
                <circle cx="190" cy="420" r="2" fill="#daa520"/>
                <circle cx="190" cy="505" r="3.5" fill="#b8860b" stroke="#8b6914" stroke-width="1.2"/>
                <circle cx="190" cy="505" r="2" fill="#daa520"/>
            </g>

            <!-- Tools in foreground (shadow puppet style with layered panels) -->
            <g id="tools-group" class="scene-element">
                <!-- Hoe (translucent dyed cowhide with gold thread) -->
                <g id="hoe" class="tool" data-tool="hoe">
                    <!-- Handle (wood with natural grain) -->
                    <line x1="280" y1="600" x2="320" y2="540" stroke="#8b4513" stroke-width="4.5" stroke-linecap="round"/>
                    <line x1="282" y1="598" x2="322" y2="542" stroke="#6a4028" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

                    <!-- Blade (iron with openwork) -->
                    <path d="M 318 542 L 340 535 L 342 545 L 320 552 Z"
                          fill="#5a5a5a" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.5" filter="url(#amber-glow)"/>
                    <!-- Perforation pattern on blade -->
                    <rect x="325" y="540" width="12" height="8" fill="url(#perforation)" opacity="0.7"/>
                    <!-- Leather texture -->
                    <path d="M 318 542 L 340 535 L 342 545 L 320 552 Z" fill="url(#leather-texture)" opacity="0.3"/>

                    <!-- Gold thread outlining -->
                    <path d="M 320 545 L 338 540" stroke="url(#gold-thread)" stroke-width="1.2" opacity="0.9"/>
                    <path d="M 318 543 L 340 536" stroke="url(#gold-thread)" stroke-width="0.8" opacity="0.7"/>

                    <!-- Brass rivet -->
                    <circle cx="320" cy="547" r="2.5" fill="#b8860b" stroke="#8b6914" stroke-width="1"/>
                    <circle cx="320" cy="547" r="1.5" fill="#daa520"/>
                </g>

                <!-- Shovel (translucent dyed cowhide with gold thread) -->
                <g id="shovel" class="tool" data-tool="shovel">
                    <!-- Handle (wood with natural grain) -->
                    <line x1="380" y1="600" x2="420" y2="540" stroke="#8b4513" stroke-width="4.5" stroke-linecap="round"/>
                    <line x1="382" y1="598" x2="422" y2="542" stroke="#6a4028" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

                    <!-- Blade (iron with openwork) -->
                    <path d="M 418 542 Q 425 538 435 540 L 435 558 Q 425 560 418 556 Z"
                          fill="#5a5a5a" fill-opacity="0.75" stroke="#2d1810" stroke-width="2.5" filter="url(#amber-glow)"/>
                    <!-- Perforation pattern on blade -->
                    <rect x="420" y="545" width="13" height="10" fill="url(#perforation)" opacity="0.7"/>
                    <!-- Leather texture -->
                    <path d="M 418 542 Q 425 538 435 540 L 435 558 Q 425 560 418 556 Z" fill="url(#leather-texture)" opacity="0.3"/>

                    <!-- Gold thread outlining -->
                    <path d="M 420 545 L 433 545" stroke="url(#gold-thread)" stroke-width="1.2" opacity="0.9"/>
                    <path d="M 420 552 L 433 552" stroke="url(#gold-thread)" stroke-width="0.8" opacity="0.7"/>

                    <!-- Brass rivet -->
                    <circle cx="420" cy="549" r="2.5" fill="#b8860b" stroke="#8b6914" stroke-width="1"/>
                    <circle cx="420" cy="549" r="1.5" fill="#daa520"/>
                </g>
            </g>

            <!-- Animation elements (initially hidden) -->
            <g id="animation-layer" style="display: none;">
                <!-- Tunnel (for hoe success) -->
                <ellipse id="tunnel" cx="875" cy="350" rx="0" ry="0" fill="#2d1810" fill-opacity="0.8"
                         stroke="#daa520" stroke-width="2" style="display: none;"/>

                <!-- Rain -->
                <g id="rain" style="display: none;">
                    <line x1="700" y1="0" x2="680" y2="100" stroke="#4a6fa5" stroke-width="1" opacity="0.5"/>
                    <line x1="750" y1="20" x2="730" y2="120" stroke="#4a6fa5" stroke-width="1" opacity="0.5"/>
                    <line x1="800" y1="10" x2="780" y2="110" stroke="#4a6fa5" stroke-width="1" opacity="0.5"/>
                    <line x1="850" y1="30" x2="830" y2="130" stroke="#4a6fa5" stroke-width="1" opacity="0.5"/>
                    <line x1="900" y1="0" x2="880" y2="100" stroke="#4a6fa5" stroke-width="1" opacity="0.5"/>
                    <line x1="950" y1="25" x2="930" y2="125" stroke="#4a6fa5" stroke-width="1" opacity="0.5"/>
                    <line x1="1000" y1="15" x2="980" y2="115" stroke="#4a6fa5" stroke-width="1" opacity="0.5"/>
                    <line x1="1050" y1="5" x2="1030" y2="105" stroke="#4a6fa5" stroke-width="1" opacity="0.5"/>
                </g>

                <!-- Deity on clouds -->
                <g id="deity" style="display: none;">
                    <!-- Cloud -->
                    <ellipse cx="1000" cy="150" rx="60" ry="25" fill="#ffffff" fill-opacity="0.7" stroke="#daa520" stroke-width="1"/>
                    <ellipse cx="970" cy="160" rx="40" ry="20" fill="#ffffff" fill-opacity="0.7"/>
                    <ellipse cx="1030" cy="160" rx="40" ry="20" fill="#ffffff" fill-opacity="0.7"/>

                    <!-- Deity figure (simplified shadow puppet) -->
                    <g transform="translate(1000, 120)">
                        <!-- Robe -->
                        <path d="M 0 40 Q -20 50 -25 80 L 25 80 Q 20 50 0 40 Z"
                              fill="#dc143c" fill-opacity="0.6" stroke="#daa520" stroke-width="2" filter="url(#amber-glow)"/>
                        <!-- Head -->
                        <circle cx="0" cy="30" r="12" fill="#c19a6b" fill-opacity="0.7" stroke="#daa520" stroke-width="2"/>
                        <!-- Crown -->
                        <path d="M -10 25 L -12 15 L -5 18 L 0 12 L 5 18 L 12 15 L 10 25 Z"
                              fill="#daa520" stroke="#b8860b" stroke-width="1"/>
                        <!-- Arms raised -->
                        <line x1="-15" y1="50" x2="-30" y2="35" stroke="#daa520" stroke-width="2"/>
                        <line x1="15" y1="50" x2="30" y2="35" stroke="#daa520" stroke-width="2"/>
                    </g>
                </g>

                <!-- Broken shovel piece -->
                <path id="broken-shovel" d="M 430 520 L 450 500" stroke="#5a5a5a" stroke-width="3"
                      style="display: none;"/>
            </g>
        </svg>
    </div>

    <div id="message-overlay">
        <div id="message-text"></div>
        <button id="restart-button">Restart</button>
    </div>

    <script>
        // Get URL parameters for optional seeding
        const urlParams = new URLSearchParams(window.location.search);
        const seed = urlParams.get('seed');

        // Simple seeded random number generator (if seed provided)
        let rngState = seed ? parseInt(seed) : Date.now();
        function seededRandom() {
            if (!seed) return Math.random();
            rngState = (rngState * 1664525 + 1013904223) % 4294967296;
            return rngState / 4294967296;
        }

        const hoe = document.getElementById('hoe');
        const shovel = document.getElementById('shovel');
        const messageOverlay = document.getElementById('message-overlay');
        const messageText = document.getElementById('message-text');
        const restartButton = document.getElementById('restart-button');
        const toolsGroup = document.getElementById('tools-group');
        const farmer = document.getElementById('farmer');
        const mountains = document.getElementById('mountains');

        let interactionLocked = false;

        // Tool click handlers
        hoe.addEventListener('click', () => {
            if (interactionLocked) return;
            interactionLocked = true;
            handleHoe();
        });

        shovel.addEventListener('click', () => {
            if (interactionLocked) return;
            interactionLocked = true;
            handleShovel();
        });

        restartButton.addEventListener('click', () => {
            location.reload();
        });

        // Hoe interaction: 100% success - dig tunnel
        function handleHoe() {
            toolsGroup.classList.add('disabled');

            // Animate farmer picking up hoe
            const farmerArm = document.querySelector('#farmer-arms ellipse:nth-of-type(4)');

            // Move hoe to farmer's hand
            const hoeElement = document.getElementById('hoe');
            hoeElement.style.transition = 'transform 1s';
            hoeElement.style.transform = 'translate(-60px, -80px) rotate(-45deg)';

            setTimeout(() => {
                // Digging animation
                animateDigging(() => {
                    // Reveal tunnel
                    const tunnel = document.getElementById('tunnel');
                    tunnel.style.display = 'block';

                    let rx = 0, ry = 0;
                    const tunnelInterval = setInterval(() => {
                        rx += 3;
                        ry += 2;
                        tunnel.setAttribute('rx', rx);
                        tunnel.setAttribute('ry', ry);

                        if (rx >= 60) {
                            clearInterval(tunnelInterval);
                            setTimeout(() => {
                                fadeAndShowMessage("You have successfully created the first underground tunnel in human history.");
                            }, 500);
                        }
                    }, 30);
                });
            }, 1000);
        }

        // Shovel interaction: probabilistic outcomes
        function handleShovel() {
            toolsGroup.classList.add('disabled');

            // Move shovel to farmer's hand
            const shovelElement = document.getElementById('shovel');
            shovelElement.style.transition = 'transform 1s';
            shovelElement.style.transform = 'translate(-180px, -80px) rotate(-30deg)';

            setTimeout(() => {
                // Step 1: Check if shovel breaks (15% chance)
                const rBreak = seededRandom();

                if (rBreak < 0.15) {
                    // Shovel breaks
                    animateShovelBreak(() => {
                        fadeAndShowMessage("Success is not guaranteed; setbacks are the main theme.");
                    });
                } else {
                    // Step 2: Sequential event checks
                    const r = seededRandom();

                    if (r < 0.20) {
                        // 20% rain/landslide
                        animateRainLandslide(() => {
                            fadeAndShowMessage("Success or misfortune, which comes first?");
                        });
                    } else if (r < 0.60) {
                        // 50% of remaining 80% = 40% divine intervention
                        animateDivineIntervention(() => {
                            fadeAndShowMessage("Man proposes, God disposes.");
                        });
                    } else {
                        // 50% of remaining 80% = 40% success
                        animateShovelSuccess(() => {
                            fadeAndShowMessage("The light boat has already passed ten thousand mountains.");
                        });
                    }
                }
            }, 1000);
        }

        // Animation functions
        function animateDigging(callback) {
            const farmerTorso = document.getElementById('farmer-torso');
            let count = 0;
            const digInterval = setInterval(() => {
                if (count % 2 === 0) {
                    farmerTorso.style.transform = 'translate(5px, 3px) rotate(3deg)';
                } else {
                    farmerTorso.style.transform = 'translate(-2px, 0px) rotate(-2deg)';
                }
                count++;
                if (count >= 8) {
                    clearInterval(digInterval);
                    farmerTorso.style.transform = '';
                    callback();
                }
            }, 300);
        }

        function animateShovelBreak(callback) {
            const shovelElement = document.getElementById('shovel');
            const brokenPiece = document.getElementById('broken-shovel');

            // Snap animation
            shovelElement.style.transition = 'transform 0.2s';
            shovelElement.style.transform += ' rotate(20deg)';

            setTimeout(() => {
                brokenPiece.style.display = 'block';
                brokenPiece.style.transition = 'transform 0.5s, opacity 0.5s';
                brokenPiece.style.transform = 'translate(30px, 40px) rotate(45deg)';
                brokenPiece.style.opacity = '0';

                setTimeout(callback, 800);
            }, 200);
        }

        function animateRainLandslide(callback) {
            const rain = document.getElementById('rain');
            const frontMountain = document.getElementById('front-mountain');

            rain.style.display = 'block';

            // Animate rain falling
            let rainY = 0;
            const rainInterval = setInterval(() => {
                rainY += 20;
                rain.style.transform = `translateY(${rainY}px)`;
                if (rainY >= 400) {
                    clearInterval(rainInterval);
                }
            }, 100);

            setTimeout(() => {
                // Landslide - mountain collapses
                frontMountain.style.transition = 'transform 1.5s, opacity 1.5s';
                frontMountain.style.transform = 'translateY(100px) scale(0.9)';
                frontMountain.style.opacity = '0.3';

                // Farmer occluded
                farmer.style.transition = 'opacity 1s';
                farmer.style.opacity = '0.2';

                setTimeout(callback, 1500);
            }, 1500);
        }

        function animateDivineIntervention(callback) {
            const deity = document.getElementById('deity');
            const frontMountain = document.getElementById('front-mountain');
            const backMountain = document.getElementById('back-mountain');

            deity.style.display = 'block';
            deity.style.transformOrigin = 'center';
            deity.style.transform = 'translate(0, -100px)';
            deity.style.opacity = '0';
            deity.style.transition = 'transform 2s, opacity 2s';

            setTimeout(() => {
                deity.style.transform = 'translate(0, 0)';
                deity.style.opacity = '1';
            }, 100);

            setTimeout(() => {
                // Deity raises arms and mountain dissolves
                deity.style.filter = 'drop-shadow(0 0 15px rgba(218, 165, 32, 0.9))';

                // Mountain dissolves into particles
                frontMountain.style.transition = 'opacity 2s, transform 2s';
                frontMountain.style.opacity = '0';
                frontMountain.style.transform = 'scale(0.5) translateY(-50px)';

                backMountain.style.transition = 'opacity 2s, transform 2s';
                backMountain.style.opacity = '0';
                backMountain.style.transform = 'scale(0.5) translateY(-50px)';

                setTimeout(callback, 2000);
            }, 2000);
        }

        function animateShovelSuccess(callback) {
            const frontMountain = document.getElementById('front-mountain');
            const backMountain = document.getElementById('back-mountain');

            // Progressive lowering of mountain
            let scale = 1;
            const lowerInterval = setInterval(() => {
                scale -= 0.05;
                frontMountain.style.transformOrigin = 'bottom';
                frontMountain.style.transform = `scaleY(${scale})`;
                backMountain.style.transformOrigin = 'bottom';
                backMountain.style.transform = `scaleY(${scale * 0.8})`;

                if (scale <= 0.3) {
                    clearInterval(lowerInterval);
                    setTimeout(callback, 500);
                }
            }, 150);
        }

        function fadeAndShowMessage(message) {
            // Fade all scene elements
            const sceneElements = document.querySelectorAll('.scene-element');
            sceneElements.forEach(el => {
                el.classList.add('fade-out');
            });
            toolsGroup.classList.add('fade-out');

            setTimeout(() => {
                messageText.textContent = message;
                messageOverlay.style.display = 'flex';
            }, 1500);
        }
    </script>
</body>
</html>
